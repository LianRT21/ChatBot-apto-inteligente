<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Diagrama 3: Arquitectura Funcional Chatbot + MCP</title>
<style>
  body {
    margin: 0;
    padding: 25px;
    background: #0f172a;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #f8fafc;
    width: 1200px;
    height: 800px;
    box-sizing: border-box;
  }
  h1 {
    margin: 0 0 6px 0;
    font-size: 24px;
    color: #38bdf8;
    text-align: center;
  }
  .subtitle {
    text-align: center;
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 20px;
  }
  .diagram-svg {
    width: 100%;
    height: 700px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
  }
</style>
</head>
<body>
  <h1>🧠 ARQUITECTURA FUNCIONAL: CHATBOT CONVERSACIONAL + DOMÓTICA MCP</h1>
  <div class="subtitle">El control domótico COMPLEMENTA al asistente de voz sin reemplazar sus capacidades de conversación</div>

  <svg class="diagram-svg" viewBox="0 0 1140 680" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
      </marker>
      <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
      </marker>
      <marker id="arrow-pink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
      </marker>
    </defs>

    <!-- USUARIO -->
    <rect x="40" y="270" width="160" height="150" rx="14" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
    <text x="120" y="315" text-anchor="middle" fill="#93c5fd" font-size="16" font-weight="bold">USUARIO</text>
    <text x="120" y="340" text-anchor="middle" fill="#ffffff" font-size="28">🗣️ 👂</text>
    <text x="120" y="375" text-anchor="middle" fill="#bfdbfe" font-size="11">Habla por voz y</text>
    <text x="120" y="395" text-anchor="middle" fill="#bfdbfe" font-size="11">escucha respuestas</text>

    <!-- ENTRADA DE VOZ (INMP441 -> OPUS) -->
    <path d="M 200 320 L 260 320" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="230" y="310" text-anchor="middle" fill="#38bdf8" font-size="11">Voz (Audio)</text>

    <!-- ESP32 FRONT-END -->
    <rect x="270" y="180" width="220" height="330" rx="14" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <text x="380" y="215" text-anchor="middle" fill="#60a5fa" font-size="16" font-weight="bold">ESP32 (Dispositivo)</text>
    
    <rect x="285" y="235" width="190" height="50" rx="6" fill="#1e293b" stroke="#3b82f6"/>
    <text x="380" y="255" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold">Captura Audio + VAD</text>
    <text x="380" y="273" text-anchor="middle" fill="#64748b" font-size="10">Códec Opus 16kHz</text>

    <rect x="285" y="300" width="190" height="70" rx="6" fill="#1e293b" stroke="#10b981"/>
    <text x="380" y="322" text-anchor="middle" fill="#a7f3d0" font-size="12" font-weight="bold">Despachador MCP Local</text>
    <text x="380" y="342" text-anchor="middle" fill="#cbd5e1" font-size="10">• Control de Luces</text>
    <text x="380" y="358" text-anchor="middle" fill="#cbd5e1" font-size="10">• Control de Puertas</text>

    <rect x="285" y="385" width="190" height="50" rx="6" fill="#1e293b" stroke="#f59e0b"/>
    <text x="380" y="405" text-anchor="middle" fill="#fde047" font-size="12" font-weight="bold">Decodificador Opus</text>
    <text x="380" y="423" text-anchor="middle" fill="#64748b" font-size="10">MAX98357A + Parlante 3W</text>

    <rect x="285" y="450" width="190" height="45" rx="6" fill="#1e293b" stroke="#ec4899"/>
    <text x="380" y="470" text-anchor="middle" fill="#f472b6" font-size="11" font-weight="bold">Pantalla OLED SSD1306</text>
    <text x="380" y="486" text-anchor="middle" fill="#64748b" font-size="9">Expresiones / Texto / Avisos</text>

    <!-- NUBE / SERVIDOR XIAOZHI (LLM) -->
    <path d="M 490 260 L 570 260" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="530" y="250" text-anchor="middle" fill="#38bdf8" font-size="10">Streaming Opus</text>

    <rect x="580" y="100" width="300" height="490" rx="16" fill="#1e1e38" stroke="#8b5cf6" stroke-width="3"/>
    <text x="730" y="140" text-anchor="middle" fill="#c084fc" font-size="18" font-weight="bold">SERVIDOR IA / CEREBRO CLOUD</text>
    <text x="730" y="165" text-anchor="middle" fill="#e9d5ff" font-size="12">LLM (Qwen / DeepSeek / GPT-4o)</text>

    <!-- RAMA 1: CONVERSACIÓN GENERAL -->
    <rect x="600" y="190" width="260" height="130" rx="10" fill="#0f172a" stroke="#3b82f6"/>
    <text x="730" y="215" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="bold">1. FUNCIONES DE CHATBOT (100% ACTIVAS)</text>
    <text x="615" y="240" fill="#cbd5e1" font-size="11">• Responder preguntas generales</text>
    <text x="615" y="260" fill="#cbd5e1" font-size="11">• Contar chistes, cuentos, noticias</text>
    <text x="615" y="280" fill="#cbd5e1" font-size="11">• Mantener diálogos continuos con contexto</text>
    <text x="615" y="300" fill="#cbd5e1" font-size="11">• Modulación de personalidad y empatía</text>

    <!-- RAMA 2: CONTROL DOMÓTICO MCP -->
    <rect x="600" y="340" width="260" height="230" rx="10" fill="#0f172a" stroke="#10b981"/>
    <text x="730" y="365" text-anchor="middle" fill="#34d399" font-size="13" font-weight="bold">2. HERRAMIENTAS DOMÓTICAS (MCP)</text>
    <text x="615" y="390" fill="#a7f3d0" font-size="11" font-weight="bold">Si el usuario da una orden física:</text>
    <text x="615" y="410" fill="#e2e8f0" font-size="10">El LLM invoca la herramienta MCP adecuada:</text>
    <rect x="610" y="420" width="240" height="25" rx="4" fill="#064e3b"/>
    <text x="730" y="437" text-anchor="middle" fill="#6ee7b7" font-size="10">apartment.control_light(zone, action)</text>
    <rect x="610" y="455" width="240" height="25" rx="4" fill="#064e3b"/>
    <text x="730" y="472" text-anchor="middle" fill="#6ee7b7" font-size="10">apartment.control_door(door, action)</text>
    <rect x="610" y="490" width="240" height="25" rx="4" fill="#064e3b"/>
    <text x="730" y="507" text-anchor="middle" fill="#6ee7b7" font-size="10">apartment.get_status()</text>
    <text x="615" y="540" fill="#fef08a" font-size="11" font-weight="bold">★ Y el LLM SIEMPRE responde por voz</text>
    <text x="615" y="555" fill="#fef08a" font-size="10">confirmando la acción y continuando el chat</text>

    <!-- FEEDBACK HARDWARE MAQUETA -->
    <path d="M 600 450 L 520 450 L 520 340 L 480 340" stroke="#10b981" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#arrow-green)"/>
    <text x="540" y="430" text-anchor="middle" fill="#10b981" font-size="10">Comando MCP</text>

    <!-- ACTUADORES FÍSICOS -->
    <rect x="940" y="240" width="160" height="230" rx="12" fill="#881337" stroke="#f43f5e" stroke-width="2"/>
    <text x="1020" y="270" text-anchor="middle" fill="#fecdd3" font-size="15" font-weight="bold">MAQUETA</text>
    <text x="1020" y="295" text-anchor="middle" fill="#ffe4e6" font-size="12">Actuadores Físicos</text>
    
    <rect x="955" y="315" width="130" height="55" rx="6" fill="#1e293b"/>
    <text x="1020" y="337" text-anchor="middle" fill="#facc15" font-size="12" font-weight="bold">5x Bombillos</text>
    <text x="1020" y="357" text-anchor="middle" fill="#fef08a" font-size="10">Luces por zona</text>

    <rect x="955" y="385" width="130" height="65" rx="6" fill="#1e293b"/>
    <text x="1020" y="407" text-anchor="middle" fill="#f43f5e" font-size="12" font-weight="bold">4x Servos 180°</text>
    <text x="1020" y="427" text-anchor="middle" fill="#ffe4e6" font-size="10">Puertas (0° - 180°)</text>

    <path d="M 475 350 L 930 350" stroke="#f43f5e" stroke-width="3" marker-end="url(#arrow-pink)"/>
    <text x="730" y="630" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="bold">
      Voz Conversacional + Control Físico = Experiencia Asistente Completa
    </text>

    <!-- RETORNO DE VOZ AL USUARIO -->
    <path d="M 270 410 L 170 410" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="215" y="430" text-anchor="middle" fill="#f59e0b" font-size="11">Voz Asistente</text>
  </svg>
</body>
</html>
